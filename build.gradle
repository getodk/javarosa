buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:9.1.1")
        classpath("me.champeau.jmh:jmh-gradle-plugin:0.7.3")
    }
}

plugins {
    id 'com.vanniktech.maven.publish' version '0.37.0' apply false
}

/**
 * If `android` is true, the project will be configured as an Android rather than a Java library. This isn't used
 * for building archives (such as an APK), but is useful for performing Android checks like lint.
 */
if (!project.hasProperty("android")) {
    apply plugin: 'java-library'
    apply plugin: 'checkstyle'
    apply plugin: 'jacoco'
    apply plugin: 'me.champeau.jmh'
    apply plugin: 'com.vanniktech.maven.publish'
} else {
    apply plugin: 'com.android.library'
}

plugins.withId('com.android.library') {
    dependencies {
        coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    }
}

repositories {
    google()
    mavenCentral()
}

if (!project.hasProperty("android")) {
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }


    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs.add('-Xlint:deprecation')
    }

    tasks.named('compileJava', JavaCompile) {
        options.release = 17
    }

    // TODO: does not build UML diagrams
    tasks.named('javadoc', Javadoc) {
        failOnError = false
    }

    tasks.named('jacocoTestReport', JacocoReport) {
        reports {
            xml.required = false
        }
    }

    // Required to use fileExtensions property in checkstyle file
    checkstyle {
        toolVersion = '7.6.1'
    }

    tasks.named('jmhJar') {
        doFirst {
            new File("build/resources/test").mkdirs()
        }
    }

    jmh {
        excludes = ["(BenchmarkTemplate)"]
        threads = 1
        fork = 1
        warmup = '2s'
        warmupIterations = 10
        warmupBatchSize = 1
        warmupForks = 1
        iterations = 20
        timeOnIteration = '2s'
        timeUnit = 's'
        benchmarkMode = ['avgt', 'ss']
        includeTests = true
        resultFormat = 'CSV'
        forceGC = true
        duplicateClassesStrategy = DuplicatesStrategy.WARN
    }

    group = 'org.getodk'

    def git = { args -> "git ${args}".execute().text.trim() }
    def tag = git('describe --tags --exact-match --match v[0-9]*')

    version = tag.startsWith('v')
        ? tag.substring(1)
        : "${git('rev-parse --short=7 HEAD')}-SNAPSHOT"

    mavenPublishing {
        publishToMavenCentral(true)

        if (providers.environmentVariable('ORG_GRADLE_PROJECT_signingInMemoryKey').isPresent()) {
            signAllPublications()
        }

        coordinates(group.toString(), 'javarosa', version.toString())

        pom {
            name = 'javarosa'
            description = 'A Java library for rendering ODK XForms'
            url = 'https://github.com/getodk/javarosa'

            licenses {
                license {
                    name = 'The Apache Software License, Version 2.0'
                    url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                }
            }

            developers {
                developer {
                    name = 'getodk'
                    email = 'email@getodk.org'
                    organization = 'Get ODK'
                    organizationUrl = 'https://getodk.org'
                }
            }

            scm {
                connection = 'scm:git:https://github.com/getodk/javarosa.git'
                developerConnection = 'scm:git:ssh://git@github.com/getodk/javarosa.git'
                url = 'https://github.com/getodk/javarosa'
            }
        }
    }
} else {
    android {
        namespace = 'com.example'
        compileSdk = 36

        defaultConfig {
            minSdk = 26
            targetSdk = 36
            versionCode = 1
            versionName = "1.0"
            testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        }

        compileOptions {
            coreLibraryDesugaringEnabled = true // For APIs requiring > API 21
            sourceCompatibility = JavaVersion.VERSION_17
            targetCompatibility = JavaVersion.VERSION_17
        }

        buildTypes {
            release {
                minifyEnabled = false
            }
        }
    }

    configurations.configureEach {
        resolutionStrategy {
            // Fix mismatch with kotlin-stdlib
            force('org.jetbrains:annotations:26.0.2')
        }
    }
}

dependencies {
    api 'joda-time:joda-time:2.10.13'
    api 'org.slf4j:slf4j-api:1.7.33'
    api 'com.fasterxml.jackson.core:jackson-databind:2.22.3'
    api 'org.jetbrains.kotlin:kotlin-stdlib:2.4.20'
    api 'org.bouncycastle:bcprov-jdk18on:1.86'
    api 'net.sf.kxml:kxml2:2.3.0'
    compileOnly 'org.jetbrains:annotations:26.0.2'

    api 'org.apache.commons:commons-csv:1.4'
    api 'commons-io:commons-io:2.14.0'

    testImplementation 'ch.qos.logback:logback-classic:1.6.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.hamcrest:hamcrest-all:1.3'
    testCompileOnly 'org.jetbrains:annotations:26.0.2'
}