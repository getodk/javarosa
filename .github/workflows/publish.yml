name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: sonatype
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: Verify release version
        if: github.ref_type == 'tag'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          POM_VERSION="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"

          if [[ "$TAG_VERSION" != "$POM_VERSION" ]]; then
            echo "Tag version ($TAG_VERSION) does not match POM version ($POM_VERSION)"
            exit 1
          fi

      - name: Set snapshot version
        if: github.ref_type != 'tag'
        run: mvn versions:set -DnewVersion="${GITHUB_SHA::7}-SNAPSHOT" -DgenerateBackupPoms=false

      - name: Publish
        run: mvn clean deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
