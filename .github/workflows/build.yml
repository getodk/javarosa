name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gradle:
    name: Gradle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build
        run: ./gradlew check jacocoTestReport javadoc jar

      - name: Upload JAR
        uses: actions/upload-artifact@v6
        with:
          name: gradle-jar
          path: build/libs/*.jar

  android:
    name: Verify Android compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android lint
        run: ./gradlew -Pandroid lintDebug --max-workers=1

  maven:
    name: Maven
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build
        run: mvn clean verify -Dgpg.skip=true
